[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-stabilization-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor using static source evidence"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
video-stabilization-claim-audit = "video_stabilization_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["video_stabilization_claim_audit*"]
